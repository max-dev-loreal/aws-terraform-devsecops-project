name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr 
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Registry (Debug)
        run: |
          echo "Output registry from step: '${{ steps.login-ecr.outputs.registry }}'"

          AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          AWS_REGION="${{ secrets.AWS_REGION }}"
          MANUAL_REGISTRY="${AWS_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "Manual computed registry: ${MANUAL_REGISTRY}"

          echo "ECR_REGISTRY=${MANUAL_REGISTRY}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ha-cloud-app:${{ github.sha }} ./app

      - name: Run container and check health
        run: |
          docker run -d -p 8000:8000 --name test-app ha-cloud-app:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || (docker logs test-app && exit 1)
          docker stop test-app
          docker rm test-app


      - name: Tag and Push to ECR
        run: |
          IMAGE_SHA="${{ github.sha }}"
          REGISTRY="${{ env.ECR_REGISTRY }}"

          
          if [ -z "$REGISTRY" ]; then
            echo "ERROR: ECR_REGISTRY is empty!"
            exit 1
          fi
          
          echo "Using registry: $REGISTRY"



          docker tag ha-cloud-app:$IMAGE_SHA $REGISTRY/ha-cloud-app:$IMAGE_SHA
          docker push $REGISTRY/ha-cloud-app:$IMAGE_SHA

          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag ha-cloud-app:$IMAGE_SHA $REGISTRY/ha-cloud-app:latest
            docker push $REGISTRY/ha-cloud-app:latest
          fi

      - name: Update K8s manifest image tag
        if: github.ref == 'refs/heads/main'
        run: |
          REGISTRY="${{ env.ECR_REGISTRY }}"
          if [ -z "$REGISTRY" ]; then
            echo "ERROR: ECR_REGISTRY is empty!"
            exit 1
          fi
          sed -i "s|image: .*|image: $REGISTRY/ha-cloud-app:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Notify Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *CI Docker* УСПЕШНО\n🐳 Image SHA: \`${{ github.sha }}\`\n📦 Registry: \`${{ env.ECR_REGISTRY }}\`"
          else
            MSG="❌ *CI Docker* УПАЛ\n👤 ${{ github.actor }}\n🔗 [Открыть лог](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$MSG"
