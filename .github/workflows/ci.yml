name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t ha-cloud-app:${{ github.sha }} ./app

      - name: Run container and check health
        run: |
          docker run -d -p 8000:8000 --name test-app ha-cloud-app:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health

      - name: Tag and Push to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "ECR Registry: $REGISTRY"
          docker tag ha-cloud-app:$IMAGE_TAG $REGISTRY/ha-cloud-app:$IMAGE_TAG
          docker tag ha-cloud-app:$IMAGE_TAG $REGISTRY/ha-cloud-app:latest
          docker push $REGISTRY/ha-cloud-app:$IMAGE_TAG
          docker push $REGISTRY/ha-cloud-app:latest

      - name: Update K8s manifest image tag
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*|image: $REGISTRY/ha-cloud-app:$IMAGE_TAG|g" k8s/deployment.yaml

      - name: Notify Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *CI Docker* УСПЕШНО\n🐳 SHA: \`${{ github.sha }}\`"
          else
            MSG="❌ *CI Docker* УПАЛ\n👤 Автор: ${{ github.actor }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$MSG"
