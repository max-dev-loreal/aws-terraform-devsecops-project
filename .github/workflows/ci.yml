name: CI pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install flake8 black isort

      - name: Check import order with isort
        run: isort --check-only app/

      - name: Check formatting with black
        run: black --check app/

      - name: Lint with flake8
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest app/ -v --cov=app --cov-report=xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t statuspage:${{ github.sha }} ./app

      - name: Test container health
        run: |
          docker run -d -p 8000:8000 --name test-app statuspage:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || (docker logs test-app && exit 1)
          docker stop test-app
          docker rm test-app

  pr-comment:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'pull_request'
    permissions: 
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All checks passed — ready to merge!'
            })
