name: 'Terraform Apply Dispatch'

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: 'Run ID of the plan workflow'
        required: true
      action:
        description: 'What to do'
        type: choice
        options:
          - apply
          - destroy
        required: true

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "eu-north-1"

defaults:
  run:
    shell: bash
    working-directory: ./infra

jobs:
  terraform:
    name: 'Terraform ${{ github.event.inputs.action }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Download approved plan
        if: github.event.inputs.action == 'apply'
        run: |
          aws s3 cp s3://tfplans-platform-prod-103242399399/plans/${{ github.event.inputs.plan_run_id }}/tfplan tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Notify Telegram
        if: always()
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ "${{ job.status }}" = "success" ]; then
            MSG="🚀 *Terraform ${ACTION}* completed successfully"
          else
            MSG="💥 *Terraform ${ACTION}* failed"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=${MSG}"
