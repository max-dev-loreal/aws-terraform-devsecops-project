apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
   app: web-service
spec:
     replicas: 2
     selector:
       matchLabels:
         app: web-service
     template:
       metadata:
         labels:
           app: web-service
       spec:
         containers:
         - name: my-container
           image: ha-app:latest
           imagePullPolicy: Never
           ports:
           - containerPort: 5000
           livenessProbe:
             httpGet:
               path: /health
               port: 5000
             initialDelaySeconds: 5
             periodSeconds: 10
